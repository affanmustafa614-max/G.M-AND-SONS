<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VASTRA | Modern Indian Luxury</title>
    <style>
        /* Phase 2: CSS Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', serif; background-color: #F8F6F2; color: #1C1C1C; }
        
        nav { display: flex; justify-content: space-between; padding: 2rem 5%; background: #F8F6F2; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: 4px; color: #0F3D2E; }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 2rem; }
        nav ul li a { text-decoration: none; color: #1C1C1C; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }

        .hero { height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; background: #E6C7C2; margin-bottom: 4rem; padding: 20px; }
        .hero h1 { font-size: 3rem; color: #0F3D2E; margin-bottom: 1rem; }
        .hero button { background: #C9A24D; color: white; border: none; padding: 1rem 2rem; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .hero button:hover { background: #0F3D2E; }

        .products { padding: 0 5% 4rem; text-align: center; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; margin-top: 2rem; }
        .product-card { background: white; padding: 2rem; border-bottom: 3px solid transparent; transition: 0.3s; }
        .product-card:hover { border-bottom: 3px solid #C9A24D; transform: translateY(-5px); }
        .product-image { height: 250px; background: #eee; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; font-style: italic; color: #888; }
        .price { color: #C9A24D; font-weight: bold; margin-top: 0.5rem; display: block; }

        footer { padding: 3rem 5%; background: #1C1C1C; color: #F8F6F2; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">VASTRA</div>
        <ul>
            <li><a href="#">Lungi</a></li>
            <li><a href="#">Gamcha</a></li>
            <li><a href="#">Stoles</a></li>
        </ul>
    </nav>

    <main>
        <section class="hero">
            <div>
                <h1>Heritage in Every Thread</h1>
                <p>Modern Indian luxury for the conscious soul.</p>
                <button onclick="shopNow()">Shop the Collection</button>
            </div>
        </section>

        <section class="products">
            <div class="product-grid">
                <article class="product-card">
                    <div class="product-image">Emerald Lungi</div>
                    <h3>Signature Lungi</h3>
                    <span class="price">₹2,499</span>
                </article>
                <article class="product-card">
                    <div class="product-image">Charcoal Gamcha</div>
                    <h3>Artisan Gamcha</h3>
                    <span class="price">₹1,299</span>
                </article>
                <article class="product-card">
                    <div class="product-image">Blush Stole</div>
                    <h3>Silk-Blend Stole</h3>
                    <span class="price">₹3,899</span>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 VASTRA Luxury. Handcrafted in India.</p>
    </footer>

    <script>
        function shopNow() {
            alert("Redirecting to our curated collection...");
            window.scrollTo({ top: 600, behavior: 'smooth' });
        }
    </script>
</body>
</html>
